# ImageNet specific configuration
inherit: base_config.yaml

# Device configuration
device: 1

# Caching configuration
cache:
  enabled: true
  dir: cache

# Dataset specific parameters
dataset:
  name: imagenet
  num_classes: 1000
  input_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  data_dir: data/imagenet

# Base model configuration
model:
  architecture: vit_base_patch16_224
  pretrained_path: models/vit_imagenet.pth
  img_size: 224
  drop_path_rate: 0.1
  drop_rate: 0.1

# Paths
plot_dir: plots/imagenet
log_dir: logs/imagenet

# Training parameters
num_epochs: 50
batch_size: 256
target_coverage: 0.9
training_subset_fraction: 1.0  # Use 1.0 for full dataset

# Training configuration
training:
  grad_clip:
    enabled: true
    max_norm: 0.5
  loss_weights:
    coverage: 1.0  # Reduced from 5.0 - proven stable value
    size: 5.0      # Increased from 2.0 - better set size control
    margin: 0.05   # Keep low for stability

# Optimizer configuration
optimizer:
  name: 'AdamW'
  params:
    lr: 0.0001  # Doubled from 0.00005 - better learning
    weight_decay: 0.05  # Increased from 0.01 - better regularization
  scheduler:
    name: 'CosineAnnealingWarmRestarts'  # More stable than OneCycleLR
    params:
      T_0: 5
      T_mult: 1
      eta_min: 0.00001

# Scoring function architecture
scoring_function:
  architecture_mode: 'auto'  # Will use [128, 64] for 1000 classes
  hidden_dims: [128, 64]  # Used only when architecture_mode='manual'
  dropout: 0.3
  l2_lambda: 0.01
  num_features: 8

# Tau calibration
tau:
  min: -10.0
  max: 10.0
  window_size: 5

# Set size constraints
set_size:
  target: 1
  max: 10  # Higher for 1000 classes
  margin: 1.5  # Reduced from 2.0 for better balance

# Training dynamics - Critical for stability
training_dynamics:
  stability_factor: 0.05  # Controls loss stability
  coverage_tolerance: 0.02  # Acceptable deviation from target coverage
  coverage_boost: 2.0  # Boost coverage loss when below target
  size_penalty_boost: 1.5  # Boost size penalty when coverage is good
  ece_test_points: 10  # Number of bins for ECE calculation
  num_workers: 4  # For parallel data loading