# ImageNet specific configuration
inherit: base_config.yaml

# Device configuration
device: 1

# Caching configuration
cache:
  enabled: true
  dir: cache

# Dataset specific parameters
dataset:
  name: imagenet
  num_classes: 1000
  input_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  data_dir: data/imagenet

# Base model configuration
model:
  architecture: vit_base_patch16_224
  pretrained_path: models/vit_imagenet.pth
  img_size: 224
  drop_path_rate: 0.1
  drop_rate: 0.1

# Paths
plot_dir: plots/imagenet
log_dir: logs/imagenet

# Training parameters
num_epochs: 50
batch_size: 256
target_coverage: 0.9
training_subset_fraction: 1.0  # Use 1.0 for full dataset

# Training configuration
training:
  grad_clip:
    enabled: true
    max_norm: 0.5
  loss_weights:
    coverage: 5.0
    size: 2.0
    margin: 0.05

# Optimizer configuration
optimizer:
  name: 'AdamW'
  params:
    lr: 0.00005
    weight_decay: 0.01
  scheduler:
    name: 'OneCycleLR'
    params:
      max_lr: 0.00005
      pct_start: 0.2
      div_factor: 20
      final_div_factor: 100
      anneal_strategy: 'cos'

# Scoring function architecture
scoring_function:
  architecture_mode: 'auto'  # Will use [128, 64] for 1000 classes
  hidden_dims: [128, 64]  # Used only when architecture_mode='manual'
  dropout: 0.3
  l2_lambda: 0.01
  num_features: 8

# Tau calibration
tau:
  min: -10.0
  max: 10.0
  window_size: 5

# Set size constraints
set_size:
  target: 1
  max: 10  # Higher for 1000 classes
  margin: 2.0

# Training dynamics
training_dynamics:
  coverage_tolerance: 0.02
  ece_test_points: 10