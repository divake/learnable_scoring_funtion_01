# HAM10000 specific configuration
inherit: base_config.yaml

# Device configuration
device: 0

# Caching configuration
cache:
  enabled: true
  dir: cache

# Dataset specific parameters
dataset:
  name: ham10000
  num_classes: 7
  data_dir: data/ham10000
  class_names: ['akiec', 'bcc', 'bkl', 'df', 'mel', 'nv', 'vasc']
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# Base model configuration
model:
  type: vit
  name: google/vit-base-patch16-224
  pretrained: true
  vit:
    img_size: 224
    patch_size: 16
    num_heads: 12
    num_layers: 12

# Paths
plot_dir: plots/ham10000
log_dir: logs/ham10000

# Training parameters
num_epochs: 20
batch_size: 32
target_coverage: 0.9

# Training configuration
training:
  grad_clip:
    enabled: true
    max_norm: 1.0
  loss_weights:
    coverage: 1.0  # Already at stable value
    size: 5.0      # Increased from 3.0 - better set size control
    margin: 0.05   # Reduced from 0.1 - less aggressive

# Optimizer configuration
optimizer:
  name: 'AdamW'
  params:
    lr: 0.0001  # Already at stable value
    weight_decay: 0.05  # Increased from 0.01 - better regularization
  scheduler:
    name: 'CosineAnnealingWarmRestarts'
    params:
      T_0: 5
      T_mult: 1
      eta_min: 0.00001

# Scoring function architecture
scoring_function:
  architecture_mode: 'auto'  # Will use [32, 16] for 7 classes
  hidden_dims: [32, 16]  # Used only when architecture_mode='manual'
  dropout: 0.2
  l2_lambda: 0.01
  num_features: 8

# Tau calibration
tau:
  min: -10.0
  max: 10.0
  window_size: 5

# Set size constraints
set_size:
  target: 1
  max: 3
  margin: 1.5

# Training dynamics - Critical for stability
training_dynamics:
  stability_factor: 0.05  # Controls loss stability
  coverage_tolerance: 0.02  # Acceptable deviation from target coverage
  coverage_boost: 2.0  # Boost coverage loss when below target
  size_penalty_boost: 1.5  # Boost size penalty when coverage is good
  ece_test_points: 10  # Number of bins for ECE calculation
  num_workers: 4  # For parallel data loading