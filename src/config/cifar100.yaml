# CIFAR-100 specific configuration
inherit: base_config.yaml

# Device configuration
device: 1

# Caching configuration
cache:
  enabled: true
  dir: cache

# Dataset specific parameters
dataset:
  name: cifar100
  num_classes: 100
  input_size: [32, 32]
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]

# Base model configuration
model:
  type: resnet  # Options: 'resnet' or 'vit'
  resnet:
    architecture: resnet18
    pretrained_path: models/resnet18_cifar100_hf.pth
  vit:
    architecture: vit_base_patch16_224.augreg_in21k
    pretrained_path: models/vit_cifar100.pth
    img_size: 96

# Paths
plot_dir: plots/cifar100
log_dir: logs/cifar100

# Training parameters
num_epochs: 30
batch_size: 128
target_coverage: 0.9

# Training configuration
training:
  grad_clip:
    enabled: true
    max_norm: 0.5
  loss_weights:
    coverage: 1.0  # Weight for coverage loss
    size: 5.0      # Weight for set size loss
    margin: 0.05   # Weight for margin loss

# Optimizer configuration
optimizer:
  name: 'AdamW'
  params:
    lr: 0.0001
    weight_decay: 0.05
  scheduler:
    name: 'CosineAnnealingWarmRestarts'
    params:
      T_0: 5
      T_mult: 1
      eta_min: 0.00001

# Scoring function architecture
scoring_function:
  architecture_mode: 'auto'  # 'auto' selects based on num_classes, 'manual' uses hidden_dims
  hidden_dims: [64, 32]  # Used only when architecture_mode='manual'
  dropout: 0.3  # Dropout rate for regularization
  l2_lambda: 0.01  # L2 regularization strength
  num_features: 8  # Number of class-specific features

# Tau calibration
tau:
  min: -10.0
  max: 10.0
  window_size: 5

# Set size constraints
set_size:
  target: 1
  max: 5
  margin: 1.5

# Training dynamics
training_dynamics:
  coverage_tolerance: 0.02  # Acceptable deviation from target coverage
  ece_test_points: 10  # Number of bins for ECE calculation