# Places365 specific configuration
inherit: base_config.yaml

# Device configuration
device: 1

# Caching configuration
cache:
  enabled: true
  dir: cache

# Dataset specific parameters
dataset:
  name: places365
  num_classes: 365
  input_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  data_dir: data/places365_small
  train_subset_size: 50000  # Use subset for efficiency

# Base model configuration
model:
  type: vit
  vit:
    architecture: vit_base_patch16_224
    pretrained_path: models/vit_places365.pth
    img_size: 224
    drop_path_rate: 0.1
    drop_rate: 0.1

# Paths
plot_dir: plots/places365
log_dir: logs/places365

# Training parameters
num_epochs: 15
batch_size: 64
target_coverage: 0.9

# Training configuration
training:
  grad_clip:
    enabled: true
    max_norm: 1.0
  loss_weights:
    coverage: 10.0  # Higher for 365 classes
    size: 2.0
    margin: 0.5

# Optimizer configuration
optimizer:
  name: 'AdamW'
  params:
    lr: 0.001
    weight_decay: 0.01
  scheduler:
    name: 'CosineAnnealingWarmRestarts'
    params:
      T_0: 5
      T_mult: 1
      eta_min: 0.00001

# Scoring function architecture
scoring_function:
  architecture_mode: 'auto'  # Will use [128, 64] for 365 classes
  hidden_dims: [128, 64]  # Used only when architecture_mode='manual'
  dropout: 0.3
  l2_lambda: 0.01
  num_features: 8

# Tau calibration
tau:
  min: -10.0
  max: 10.0
  window_size: 5

# Set size constraints
set_size:
  target: 1
  max: 8  # Higher for 365 classes
  margin: 2.0

# Training dynamics
training_dynamics:
  coverage_tolerance: 0.02
  ece_test_points: 10