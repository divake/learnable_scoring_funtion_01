# PlantNet-300K configuration
inherit: base_config.yaml

# Device configuration
device: 1

# Caching configuration  
cache:
  enabled: true
  dir: cache/plantnet
  compression: false

# Dataset configuration
dataset:
  name: plantnet
  data_dir: /ssd_4TB/divake/learnable_scoring_funtion_01/data/plantnet_300k
  num_classes: 1081
  input_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# Model configuration
model:
  type: vit  # Using ViT for PlantNet
  
  # ViT configuration
  vit:
    architecture: google/vit-base-patch16-224
    pretrained_path: models/plantnet_vit_base.pth
    img_size: 224
    drop_path_rate: 0.1
    drop_rate: 0.1

# Paths
plot_dir: plots/plantnet
log_dir: logs/plantnet

# Training parameters
num_epochs: 15
batch_size: 32
target_coverage: 0.9

# Training configuration
training:
  grad_clip:
    enabled: true
    max_norm: 0.5
  loss_weights:
    coverage: 4.0  # lambda1 - for coverage control
    size: 1.5      # lambda2 - for set size control  
    margin: 0.2    # margin loss weight

# Optimizer configuration
optimizer:
  name: 'AdamW'
  params:
    lr: 0.00005  # Lower for fine-tuning with many classes
    weight_decay: 0.01
  scheduler:
    name: 'CosineAnnealingWarmRestarts'
    params:
      T_0: 5
      T_mult: 1
      eta_min: 0.000001

# Model architecture  
scoring_function:
  hidden_dims: [256, 128, 64]  # Larger network for 1081 classes
  dropout: 0.2
  l2_lambda: 0.005
  activation:
    name: 'LeakyReLU'
    params:
      negative_slope: 0.1
  final_activation:
    name: 'Sigmoid'
    params: {}

# Training constraints
tau:
  min: 0.01
  max: 15.0  # Higher max for many classes
  window_size: 5

# Set size constraints
set_size:
  target: 3  # Reasonable target for 1081 classes
  max: 10    # Allow larger sets due to many classes
  margin: 1.5

# Training dynamics
training_dynamics:
  stability_factor: 0.005
  separation_factor: 2.0
  perturbation_noise: 0.01
  permutation_augmentation_prob: 0.5
  coverage_tolerance: 0.02