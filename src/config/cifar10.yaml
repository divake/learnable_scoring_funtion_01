# CIFAR-10 specific configuration
inherit: base_config.yaml

# Device configuration
device: 1

# Caching configuration
cache:
  enabled: true
  dir: cache

# Dataset specific parameters
dataset:
  name: cifar10
  num_classes: 10
  input_size: [32, 32]
  mean: [0.4914, 0.4822, 0.4465]
  std: [0.2023, 0.1994, 0.2010]

# Base model configuration
model:
  architecture: resnet18
  pretrained_path: models/resnet18_cifar10_best.pth

# Paths
plot_dir: plots/cifar10
log_dir: logs/cifar10

# Training parameters
num_epochs: 30
batch_size: 128
target_coverage: 0.9

# Training configuration
training:
  grad_clip:
    enabled: true
    max_norm: 0.5
  loss_weights:
    coverage: 2.0  # Weight for coverage loss
    size: 1.0      # Weight for set size loss
    margin: 0.2    # Weight for margin loss

# Optimizer configuration
optimizer:
  name: 'AdamW'
  params:
    lr: 0.001
    weight_decay: 0.01
  scheduler:
    name: 'OneCycleLR'
    params:
      max_lr: 0.001
      pct_start: 0.2
      div_factor: 20
      final_div_factor: 100
      anneal_strategy: 'cos'

# Scoring function architecture
scoring_function:
  architecture_mode: 'auto'  # 'auto' selects based on num_classes, 'manual' uses hidden_dims
  hidden_dims: [32, 16]  # Used only when architecture_mode='manual'
  dropout: 0.2
  l2_lambda: 0.01
  num_features: 8

# Tau calibration
tau:
  min: -10.0
  max: 10.0
  window_size: 5

# Set size constraints
set_size:
  target: 1
  max: 3
  margin: 2

# Training dynamics
training_dynamics:
  coverage_tolerance: 0.02
  ece_test_points: 10