# CIFAR-10 specific configuration
inherit: base_config.yaml

# Device configuration
device: 1

# Caching configuration
cache:
  enabled: true
  dir: cache

# Dataset specific parameters
dataset:
  name: cifar10
  num_classes: 10
  input_size: [32, 32]
  mean: [0.4914, 0.4822, 0.4465]
  std: [0.2023, 0.1994, 0.2010]

# Base model configuration
model:
  architecture: resnet18
  pretrained_path: models/resnet18_cifar10_best.pth

# Paths
plot_dir: plots/cifar10
log_dir: logs/cifar10

# Training parameters
num_epochs: 30
batch_size: 128
target_coverage: 0.9

# Training configuration
training:
  grad_clip:
    enabled: true
    max_norm: 0.5
  loss_weights:
    coverage: 1.0  # Reduced from 2.0 - proven stable value
    size: 5.0      # Increased from 1.0 - better set size control
    margin: 0.05   # Reduced from 0.2 - less aggressive

# Optimizer configuration
optimizer:
  name: 'AdamW'
  params:
    lr: 0.0001  # Reduced from 0.001 - more stable for small dataset
    weight_decay: 0.05  # Increased from 0.01 - better regularization
  scheduler:
    name: 'CosineAnnealingWarmRestarts'  # More stable than OneCycleLR
    params:
      T_0: 5
      T_mult: 1
      eta_min: 0.00001

# Scoring function architecture
scoring_function:
  architecture_mode: 'auto'  # 'auto' selects based on num_classes, 'manual' uses hidden_dims
  hidden_dims: [32, 16]  # Used only when architecture_mode='manual'
  dropout: 0.2
  l2_lambda: 0.01
  num_features: 8

# Tau calibration
tau:
  min: -10.0
  max: 10.0
  window_size: 5

# Set size constraints
set_size:
  target: 1
  max: 3
  margin: 1.5  # Reduced from 2.0 for better balance

# Training dynamics - Critical for stability
training_dynamics:
  stability_factor: 0.05  # Controls loss stability
  coverage_tolerance: 0.02  # Acceptable deviation from target coverage
  coverage_boost: 2.0  # Boost coverage loss when below target
  size_penalty_boost: 1.5  # Boost size penalty when coverage is good
  ece_test_points: 10  # Number of bins for ECE calculation
  num_workers: 4  # For parallel data loading